name: Build TX7 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TX7 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        shell: bash
        run: |
          set -e

          if [ -f "gradlew" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "TX7Privacy_APK_Ready/gradlew" ]; then
            echo "PROJECT_DIR=TX7Privacy_APK_Ready" >> "$GITHUB_ENV"
          else
            echo "Could not find gradlew."
            find . -maxdepth 3 -type f -name gradlew -print
            exit 1
          fi

      - name: Force Java and Kotlin JVM target to 17
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/tx7-jvm17.gradle" <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.matching {
                  it.name.contains("Kotlin") && it.name.contains("Compile")
              }.configureEach {
                  try {
                      kotlinOptions.jvmTarget = "17"
                  } catch (Exception ignored) {
                  }
              }
          }
          EOF

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            -I "$RUNNER_TEMP/tx7-jvm17.gradle" \
            assembleDebug

      - name: Find generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TX7-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
