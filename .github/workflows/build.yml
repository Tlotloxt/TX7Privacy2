name: Build TX7 Privacy APK

on:
  workflow_dispatch:
  push:
    paths:
      - "TX7Privacy_APK_Ready.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract TX7 project
        run: |
          rm -rf project
          mkdir project
          unzip -o TX7Privacy_APK_Ready.zip -d project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure Java 17
        run: |
          cat > "$RUNNER_TEMP/tx7.gradle" <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }
          }
          EOF

      - name: Build TX7 APK
        run: |
          cd "$PROJECT_DIR"
          gradle \
            --no-daemon \
            --init-script "$RUNNER_TEMP/tx7.gradle" \
            clean assembleDebug

      - name: Show APK
        run: |
          echo "APK files:"
          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload TX7 APK
        uses: actions/upload-artifact@v4
        with:
          name: TX7Privacy-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
