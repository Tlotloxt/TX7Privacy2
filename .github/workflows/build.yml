name: Build TX7 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TX7 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract TX7 project
        shell: bash
        run: |
          set -e

          mkdir -p tx7_project

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          unzip -o "$ZIP_FILE" -d tx7_project

          echo "Extracted files:"
          find tx7_project -maxdepth 4 -type f | head -100

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find tx7_project -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "Searching extracted files:"
            find tx7_project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Force Java and Kotlin JVM 17
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/tx7-jvm17.gradle" <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.matching {
                  it.name.contains("Kotlin") &&
                  it.name.contains("Compile")
              }.configureEach {
                  try {
                      kotlinOptions.jvmTarget = "17"
                  } catch (Exception ignored) {
                  }
              }
          }
          EOF

      - name: Build TX7 Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Building project in:"
          pwd

          echo "Project files:"
          ls -la

          gradle \
            --no-daemon \
            --stacktrace \
            -I "$RUNNER_TEMP/tx7-jvm17.gradle" \
            assembleDebug

      - name: Find generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find . \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload TX7 APK
        uses: actions/upload-artifact@v4
        with:
          name: TX7-APK
          path: |
            tx7_project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
